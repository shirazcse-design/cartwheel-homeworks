name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        env:
          CARTWHEEL_JUDGE_TRACE_SOURCE: analysis/state/store_traces.json
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Install pinned Harbor
        run: uv tool install 'harbor==0.23.0'
      - name: Check selected agent configuration
        run: |
          test "$CARTWHEEL_MODEL" = "gpt-4o-mini" || { echo "Set CARTWHEEL_MODEL to the baseline model gpt-4o-mini"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY repository secret is required"; exit 1; }
      - name: Generate classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py
      - name: Run five attempts per case
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir "$GITHUB_WORKSPACE/.harbor/jobs" \
            --yes
      - name: Summarize evaluation evidence and enforce regression gate
        if: always()
        run: uv run python scripts/summarize_harbor_job.py .harbor/jobs/hw6-evals --expected-attempts 5
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals-${{ github.run_id }}-${{ github.run_attempt }}
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
